name: Build DealClose SIM Gateway APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-sim-gateway/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
            gradle-version: '8.2'

      - name: Build Debug APK with Gradle
        working-directory: ./android-sim-gateway
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee ../gradle-build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error title=Kotlin Compilation Errors::$(grep -E '^e: ' ../gradle-build.log | tr '\n' ' ')"
            grep -E "^e: " ../gradle-build.log || tail -n 60 ../gradle-build.log
            exit 1
          fi
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/dealclose-ai-v1.7.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/dealclose-ai-v1.6.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/dealclose-sim-gateway.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealclose-ai-apk
          path: dist-apk/dealclose-ai-v1.7.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0-release
          name: "DealClose AI v1.7.0 Luxury Android Edition (Solo Style + Smart Back Nav)"
          body: |
            ### 📱 DealClose AI Luxury Android Edition (v1.7.0)
            Download `dealclose-ai-v1.7.0.apk` below directly on your Android phone!

            ✨ **What's New in v1.7.0 (Solo Luxury Experience):**
            - 🛡️ **Smart Hardware Back Navigation**: Android hardware back button now smoothly navigates drawers, modals, threads and tabs backwards. No more accidental app closures! Double-tap back required to exit from home with native Toast.
            - 🏪 **Instant Dukan / Business Onboarding Portal**: Stunning luxury Solo-style start screen with neon ambient aura, instant 10-second shop name & category launch, and 1-Click Guest access.
            - 📳 **Physical Haptic Feedback**: Native vibration click feel on bottom tabs and primary buttons.
            - 🖤 **Deep OLED Obsidian Theme (#060608)**: Edge-to-edge status bar & navigation bar blend, hidden scrollbars, and zero overscroll bounce.
            - 📞 **Cellular Voice Calling & SIM Engine**: Silent background telephony service.
          files: |
            dist-apk/dealclose-ai-v1.7.0.apk
            dist-apk/dealclose-ai-v1.6.0.apk
            dist-apk/dealclose-sim-gateway.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
