name: Build DealClose SIM Gateway APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-sim-gateway/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
            gradle-version: '8.2'

      - name: Ensure Persistent Keystore for Seamless Updates
        working-directory: ./android-sim-gateway/app
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias dealclose -keyalg RSA -keysize 2048 -validity 10000 -storepass dealclose2026 -keypass dealclose2026 -dname "CN=DealClose AI, OU=Engineering, O=DealClose, L=Raipur, ST=Chhattisgarh, C=IN"
          fi

      - name: Build Release APK and AAB with Gradle
        working-directory: ./android-sim-gateway
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease 2>&1 | tee ../gradle-build.log || true
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error title=Kotlin Compilation Errors::$(grep -E '^e: ' ../gradle-build.log | tr '\n' ' ')"
            grep -E "^e: " ../gradle-build.log || tail -n 60 ../gradle-build.log
            exit 1
          fi
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/dealclose-ai-v1.7.9.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/dealclose-sim-gateway.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab ../dist-apk/dealclose-ai-v1.7.9.aab
          fi
          if [ -f app/release.keystore ]; then
            cp app/release.keystore ../dist-apk/dealclose.keystore
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealclose-ai-apk
          path: dist-apk/dealclose-ai-v1.7.9.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.9-release
          name: "DealClose AI v1.7.9 (Headset/Earphone Silent Audio + Ultra-Fast ASR Engine)"
          body: |
            ### 📱 DealClose AI v1.7.9 (Headset Silent Mode & Voice Recognition ASR)
            Download `dealclose-sim-gateway.apk` or `dealclose-ai-v1.7.9.apk` directly on your Android phone!

            ✨ **What's New in v1.7.9:**
            - 🎧 **Silent Room Headset/Earpiece Audio**: Telecom route dynamically switches to `ROUTE_WIRED_HEADSET` / `ROUTE_BLUETOOTH` or `ROUTE_EARPIECE` so AI voice does NOT blast through the room's loudspeaker.
            - 🎤 **VOICE_RECOGNITION AudioRecord Engine**: Bypasses Android 14 telephony noise suppression/echo cancellation that was muting customer voice during active cellular calls.
            - ⚡ **Ultra-Fast Speech STT (300ms Endpointing)**: Deepgram Nova-2 configured with `endpointing=300ms` for instant end-of-speech detection without dead silence.
            - 🚀 **Max Tokens & Low Latency LLM**: Tuned OpenAI gpt-4o-mini generation for snappy sub-300ms responses.
            - 🔑 **Consistent Keystore Signing**: Seamless updates without uninstalling!
          files: |
            dist-apk/dealclose-ai-v1.7.9.apk
            dist-apk/dealclose-ai-v1.7.9.aab
            dist-apk/dealclose-sim-gateway.apk
            dist-apk/dealclose.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
