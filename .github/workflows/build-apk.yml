name: Build DealClose SIM Gateway APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-sim-gateway/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
            gradle-version: '8.2'

      - name: Build Debug APK with Gradle
        working-directory: ./android-sim-gateway
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error title=Gradle Compilation Failure::$(tail -n 35 ../gradle-build.log | tr '\n' ' ')"
            tail -n 60 ../gradle-build.log
            exit 1
          fi
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/dealclose-sim-gateway.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealclose-sim-gateway-apk
          path: dist-apk/dealclose-sim-gateway.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "DealClose SIM Gateway v1.3.0 APK (Active Gateway Dashboard & Dual-SIM)"
          body: |
            ### 📱 DealClose SIM Gateway Companion APK (v1.3.0)
            Download `dealclose-sim-gateway.apk` below directly on your Android phone!

            ✨ **What's New in v1.3.0:**
            - **Active Gateway Dashboard UI**: Transforms automatically into a live 24/7 active dashboard once paired!
            - **Live Health & Status**: Shows Dedicated SIM 2 status, Protected SIM 1 status, Default Dialer state, and Battery worker state.
            - **Gateway Self-Test & Diagnostic**: Test connection and dialer status with one tap.
            - **Instant Ngrok / Cloud Tunneling**: Automatically discovers live backend over cellular/Wi-Fi.

            1. Install APK on your Android phone (Android 8.0+).
            2. Select **SIM 2 (AI Dedicated)**.
            3. Tap **Set as Default Phone App** and Allow.
            4. Tap **Ignore Battery Optimizations** and Allow.
            5. Enter the 6-digit code from DealClose AI Calls Hub and tap **Activate**.
          files: dist-apk/dealclose-sim-gateway.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
