name: Build DealClose SIM Gateway APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-sim-gateway/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
            gradle-version: '8.2'

      - name: Ensure Persistent Keystore for Seamless Updates
        working-directory: ./android-sim-gateway/app
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias dealclose -keyalg RSA -keysize 2048 -validity 10000 -storepass dealclose2026 -keypass dealclose2026 -dname "CN=DealClose AI, OU=Engineering, O=DealClose, L=Raipur, ST=Chhattisgarh, C=IN"
          fi

      - name: Build Release APK and AAB with Gradle
        working-directory: ./android-sim-gateway
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease 2>&1 | tee ../gradle-build.log || true
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error title=Kotlin Compilation Errors::$(grep -E '^e: ' ../gradle-build.log | tr '\n' ' ')"
            grep -E "^e: " ../gradle-build.log || tail -n 60 ../gradle-build.log
            exit 1
          fi
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/dealclose-ai-v1.7.10.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/dealclose-sim-gateway.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab ../dist-apk/dealclose-ai-v1.7.10.aab
          fi
          if [ -f app/release.keystore ]; then
            cp app/release.keystore ../dist-apk/dealclose.keystore
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealclose-ai-apk
          path: dist-apk/dealclose-ai-v1.7.10.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.10-release
          name: "DealClose AI v1.7.10 (Acoustic Half-Duplex, 350ms Tail Guard & Real Latency Measurement)"
          body: |
            ### 📱 DealClose AI v1.7.10 (Acoustic Companion Calling Engine)
            Download `dealclose-sim-gateway.apk` or `dealclose-ai-v1.7.10.apk` directly on your Android phone!

            ✨ **What's New in v1.7.10:**
            - 🛡️ **Acoustic Half-Duplex (350ms Tail Guard)**: Drops mic loop frames while AI speech is playing + 350ms tail guard to eliminate acoustic echo over loudspeaker.
            - 🔍 **Fuzzy Echo Guard Filter**: Discards transcripts matching recent AI utterances to prevent infinite self-hearing loops.
            - ⚡ **Sentence-Level Streaming LLM to TTS**: Deepgram Nova-2 (Hindi/Hinglish) + OpenAI streaming delivers first-byte audio before full response finishes.
            - ⏱️ **1.5s Latency Fallback**: Automatically triggers natural filler ("Ji, ek second...") if LLM response exceeds 1500ms.
            - 🚨 **Barge-in / Interrupt**: Instantly flushes audio buffer when customer speaks during playback.
            - 🔊 **65% Volume Guard**: Prevents speakerphone distortion and mic saturation.
            - 🛑 **Do-Not-Call (DNC) Auto-OptOut**: Automatically tags DNC, plays polite disclosure, and disconnects call.
            - 🎤 **Audio Source Toggle**: Configurable `VOICE_COMMUNICATION` / `VOICE_RECOGNITION`.
          files: |
            dist-apk/dealclose-ai-v1.7.10.apk
            dist-apk/dealclose-ai-v1.7.10.aab
            dist-apk/dealclose-sim-gateway.apk
            dist-apk/dealclose.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
